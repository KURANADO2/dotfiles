# =============================================================================
# 极简 tmux 配置 —— 配合 kitty send_text 的「免前缀」方案
#
# 核心思路：前缀键设为 C-Space，但你永远不需要手按它。
# 物理 Ctrl-Space 被 macOS 系统层拦截用于切换输入法，到不了终端；
# 所有 tmux 操作由 kitty 快捷键通过 send_text 注入「\x00(C-Space 字节) + 命令键」
# 来完成（见 kitty/kitty.conf 的 keymaps 段）。
#
# 注释约定：自定义绑定均标注 tmux 原始命令与原生默认快捷键（如有），
# 「原生」指未加载本文件时的 tmux 出厂默认，可对照 man tmux 查证
# =============================================================================

# ---------- 前缀键 ----------
set -g prefix C-Space        # 原始默认: C-b
unbind C-b                   # 释放原前缀，让 Ctrl-B 透传给 shell（光标左移）

# ---------- 终端协议（Claude Code 官方文档 terminal-config 四件套） ----------
set -g allow-passthrough on  # 放行内层程序的透传转义序列（kitty 桌面通知 OSC 99 依赖）
set -g focus-events on       # 焦点进出事件透传给内层程序（nvim、claude 检测离开依赖）；原始默认 off
set -s extended-keys on      # 扩展按键协议（CSI-u），修复 Shift+Enter 在 tmux 内失效
set -as terminal-features 'xterm*:extkeys'   # 声明外层终端（xterm-kitty）支持扩展按键

# ---------- 基础体验 ----------
set -g default-terminal "tmux-256color"      # 原始默认: screen；换 256 色并支持斜体
set -as terminal-features 'xterm*:RGB'       # 声明外层终端支持真彩色（24-bit）
set -g mouse on                              # 原始默认 off；滚轮回滚历史、点击选 pane、拖拽调大小
set -g history-limit 100000                  # 原始默认 2000；每 pane 回滚缓冲行数
set -sg escape-time 10                       # 原始默认 500ms；调低消除 nvim 按 Esc 的延迟
set -g base-index 1                          # 原始默认 0；窗口从 1 编号，与 kitty tab 一致（cmd+1..9 直达）
setw -g pane-base-index 1                    # 原始默认 0；pane 从 1 编号
set -g renumber-windows on                   # 原始默认 off；关窗后自动重排编号，不留空洞
set -g set-titles on                         # 原始默认 off；把「会话:窗口」写入 kitty 标题栏
set -g set-clipboard on                      # 原始默认 external；copy-mode 选中经 OSC 52 写系统剪贴板
setw -g mode-keys vi                         # 原始默认 emacs；copy-mode 用 vi 键位（v 选择、y 复制）

# ---------- 自定义绑定（键位字母与 kitty 快捷键对齐） ----------

# 窗口（= kitty tab）左右移动；tmux 原生无对应
# 必须带 -d（实测）：-d 时激活窗口跟着自己的窗口走 = kitty move_tab 的
# 「tab 移走我跟着」语义；不带 -d 则激活留在原索引位置、变成对面换过来的
# 那个窗口，手感与 kitty 相反
bind < swap-window -d -t -1   # 与前一个窗口交换（左移）
bind > swap-window -d -t +1   # 与后一个窗口交换（右移）

# 把当前 pane（= kitty window）送到左/右相邻窗口；tmux 原生无对应
# （替代 kitty 的 detach_window tab-left/right；原生相近功能是 prefix ! = break-pane 独立成新窗口）
bind "'" move-pane -t ":{previous}"
bind '"' move-pane -t ":{next}"

# 新窗口/新 pane 一律显式指定 -c "#{pane_current_path}"（当前 pane 的实际目录）。
# 实测：不加 -c 时 tmux 用的是「会话创建时的目录」（如 workspace.sh 里的 Note
# 目录），而不是你当前所在目录，必须显式传
bind c new-window -c "#{pane_current_path}"          # 新窗口（原生 prefix c 同样不带路径参数）
bind Enter split-window -h -c "#{pane_current_path}" # 右侧竖分，配合 kitty cmd+enter；原生 prefix %
bind % split-window -h -c "#{pane_current_path}"     # 右侧竖分（原生绑定补上当前路径）
bind '"' split-window -v -c "#{pane_current_path}"   # 上下横分（原生绑定补上当前路径）

# 上一个 pane；tmux 原生只有 o = 下一个 pane（保留），无反向键
bind O select-pane -t :.-

# 跳到第 10 个窗口（配合 cmd+0）；原始默认 0 = 选 0 号窗口，但 base-index 1 后无 0 号
bind 0 select-window -t 10

# 上一个活动窗口（配合 cmd+p）；原始默认键是 l，此处挪到 L，把 l 让给布局循环
bind L last-window

# ---------- 布局（对应 kitty 各 layout；原生 M-1..M-5 预设绑定均保留） ----------
bind t select-layout main-vertical    # kitty tall：左一大列右一小列；原始默认 M-4
bind f select-layout main-horizontal  # kitty fat：上一大行下一小行；原始默认 M-3
bind g select-layout tiled            # kitty grid：网格平铺；原始默认 M-5
bind - select-layout even-vertical    # kitty vertical：单列上下排；原始默认 M-2
bind '\' select-layout even-horizontal  # kitty horizontal：单行左右排；原始默认 M-1
bind l next-layout                    # 循环切换预设布局；原始默认 Space（l 原为 last-window，已挪至 L）
# kitty stack（只显示当前 pane）无需新绑定：原生 prefix z = resize-pane -Z 缩放开关即是

# ---------- pane 尺寸调整（原生：prefix 后按 C-方向键逐格调，或 :resize-pane） ----------
bind W resize-pane -R 3   # 加宽（右边界右移）
bind N resize-pane -L 3   # 减宽
bind T resize-pane -D 3   # 加高（下边界下移）
bind S resize-pane -U 3   # 减高
bind R select-layout -E   # 重置：把当前布局的 pane 尺寸重新均匀铺开；tmux 原生无对应

# ---------- 广播输入（替代 kitty 的 f1 broadcast kitten）；tmux 原生无对应 ----------
# 开启后当前窗口所有 pane 收到相同按键（同开多个 claude 会话批量下指令用），再按一次关闭
bind F1 set synchronize-panes \; display-message "synchronize-panes #{?synchronize-panes,on,off}"

# ---------- 浮动窗口；tmux 原生无对应 ----------
# 在当前窗口上盖一层居中浮层 shell，exit 或 q 关闭，主 pane 不受任何影响
bind P display-popup -w 85% -h 85%

# ---------- 状态栏与 pane 样式（取自 oh-my-tmux 默认主题，去掉电池/主机名等） ----------
# oh-my-tmux 调色板：#080808 深灰底 / #303030 灰 / #8a8a8a 浅灰字 / #00afff 亮蓝
#                   #ffff00 黄 / #ff00af 粉 / #e4e4e4 白
set -g status-style "fg=#8a8a8a,bg=#080808"
# 左侧区块（oh-my-tmux 原版三段式中的前两段）：黄底黑字 ❐ + 粉底白字会话名；
# 第三段 uptime 按要求舍弃。右侧时间日期也按要求舍弃（原版为 ", %R , %d %b"）
set -g status-left "#[fg=#080808,bg=#ffff00,bold] ❐ #[fg=#e4e4e4,bg=#ff00af] #S #[default]"
set -g status-left-length 20
set -g status-right ""
# 窗口条目：编号+名字；响铃加 ! 、缩放加 Z（oh-my-tmux 同款格式串）；
# 不显示默认 * 号，当前窗口用「亮蓝底黑字加粗」高亮
setw -g window-status-format " #I #W#{?#{||:#{window_bell_flag},#{window_zoomed_flag}}, ,}#{?window_bell_flag,!,}#{?window_zoomed_flag,Z,} "
setw -g window-status-style "fg=#8a8a8a,bg=#080808"
setw -g window-status-current-format " #I #W#{?#{||:#{window_bell_flag},#{window_zoomed_flag}}, ,}#{?window_bell_flag,!,}#{?window_zoomed_flag,Z,} "
setw -g window-status-current-style "fg=#080808,bg=#00afff,bold"
# 上一个用过的窗口（last）：灰底蓝字，oh-my-tmux 原版样式（window_status_last_*）
setw -g window-status-last-style "fg=#00afff,bg=#303030"
# 有动静的窗口：默认色+下划线；响铃的窗口：黄字闪烁加粗（均为 oh-my-tmux 原版）
setw -g window-status-activity-style "fg=default,bg=default,underscore"
setw -g window-status-bell-style "fg=#ffff00,bg=default,blink,bold"
# pane 分割线：非活动灰、活动亮蓝（oh-my-tmux 同款）
set -g pane-border-style "fg=#303030"
set -g pane-active-border-style "fg=#00afff"
