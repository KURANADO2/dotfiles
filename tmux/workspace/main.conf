# =============================================================================
# main 会话工作区定义（本机 Mac 版；由 tmux/workspace/new.sh 加载）
# 格式 = tmux 原生命令；执行上下文已定位到新建的 main 会话，目标可写 :窗口名
# 其他机器（如远程服务器）目录不同，请在 tmux/workspace/local/main.conf
# 写自己的版本（local/ 不进仓库）
# =============================================================================

new-window -n Note -c "~/Library/Mobile Documents/iCloud~md~obsidian/Documents/Note"
new-window -n Tmp -c "~/Tmp"

# abup_rag：两个并排 pane
new-window -n abup_rag -c "~/Code/GitLab/abup-rag"
split-window -h -t :abup_rag -c "~/Code/GitLab/abup-rag"

# Backend：五个 pane 平铺
new-window -n Backend -c "~/Code/GitLab/abup-rag"
split-window -h -t :Backend -c "~/Code/GitLab/aidota-skill"
split-window -h -t :Backend -c "~/Code/GitLab/rag-backend"
split-window -h -t :Backend -c "~/Code/GitLab/rag-frontend"
split-window -h -t :Backend -c "~/Code/GitLab/aiab-db-script"
select-layout -t :Backend tiled

# Frontend：两个 pane，默认缩放态（模拟原 kitty stack 观感，cmd+shift+= 切换）
new-window -n Frontend -c "~/Code/GitLab/abup-rag/frontend"
split-window -h -t :Frontend -c "~/Code/GitLab/rag-prototype"
resize-pane -t :Frontend.1 -Z

new-window -n File -c "~/Downloads"
new-window -n Ubuntu -c "~/Downloads"
new-window -n Dify -c "~/Downloads"
