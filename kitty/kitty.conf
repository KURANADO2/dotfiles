#: font
font_size 20.0

#: cursor
cursor_shape block

#: layout
#: 迁移 tmux 后 kitty 常态是单窗口，以下布局仅对 cmd+n 的独立 OS 窗口有意义，保留
enabled_layouts stack,tall,fat,grid,vertical,horizontal

#: window
window_border_width       1pt
hide_window_decorations   yes

#: tab
tab_bar_edge       bottom
tab_bar_style      separator
tab_bar_min_tabs   1
tab_separator      " ┃ "
#tab_title_template "🍓{index}.{title}"
tab_title_template "🍖{index}.{title}"
# tab_title_template "🍓{index}.{title}.{layout_name.upper()}"

#: ============================================================================
#: keymaps —— tmux 操作层（免前缀方案）
#:
#: 原理：kitty 不再自己管理 tab/window/layout，而是用 send_text 把
#: 「前缀键字节 \x00（= C-Space）+ 命令键」注入终端，由 tmux 解释执行。
#: 你永远不用手按前缀键；物理 Ctrl-Space 仍归 macOS 切输入法（系统层拦截，
#: 与这里的字节注入是两条互不干扰的通路）。
#: 每条注释标明：实际执行的 tmux 命令（原生 = tmux 出厂默认快捷键）。
#: tmux 侧的自定义绑定见 tmux/.tmux.conf。
#: 注意：这些映射在「非 tmux 的裸 shell 窗口」里会把字节直接打进 shell，
#: 所以 .zshrc 配置了 kitty 内自动进入 tmux（cmd+n 的独立窗口也是独立 tmux 会话）。
#: ============================================================================

#: tab（= tmux window）
map cmd+t        send_text all \x00c       # new-window，当前目录新建（原生 prefix c）
map cmd+w        send_text all \x00&       # kill-window，带 confirm-before 确认弹窗（原生 prefix &）
map cmd+shift+i  send_text all \x00,       # rename-window，弹输入框改名（原生 prefix ,）
map ctrl+shift+] send_text all \x00n       # next-window 下一个（原生 prefix n）
map ctrl+shift+[ send_text all \x00p       # previous-window 上一个（原生 prefix p）
map ctrl+shift+. send_text all \x00>       # swap-window -d -t +1 窗口右移（自定义绑定 >；kitty 原 move_tab_forward）
map ctrl+shift+, send_text all \x00<       # swap-window -d -t -1 窗口左移（自定义绑定 <；kitty 原 move_tab_backward）
map cmd+1        send_text all \x001       # select-window -t 1（原生 prefix 1）
map cmd+2        send_text all \x002       # select-window -t 2（原生 prefix 2）
map cmd+3        send_text all \x003       # select-window -t 3（原生 prefix 3）
map cmd+4        send_text all \x004       # select-window -t 4（原生 prefix 4）
map cmd+5        send_text all \x005       # select-window -t 5（原生 prefix 5）
map cmd+6        send_text all \x006       # select-window -t 6（原生 prefix 6）
map cmd+7        send_text all \x007       # select-window -t 7（原生 prefix 7）
map cmd+8        send_text all \x008       # select-window -t 8（原生 prefix 8）
map cmd+9        send_text all \x009       # select-window -t 9（原生 prefix 9）
map cmd+0        send_text all \x000       # select-window -t 10（重绑 0，因 base-index 1 后无 0 号窗口）
map cmd+p        send_text all \x00L       # last-window 最近用过的窗口（原生 prefix l，已挪至 L）

#: window（= tmux pane）
map cmd+enter    send_text all \x00\x0d    # split-window -h 当前目录右侧分屏（自定义绑定 Enter；原生 prefix %）
map cmd+shift+]  send_text all \x00o       # select-pane 下一个 pane（原生 prefix o）
map cmd+shift+[  send_text all \x00O       # select-pane 上一个 pane（自定义绑定 O）
map cmd+shift+.  send_text all \x00}       # swap-pane 与下一个 pane 换位（原生 prefix }；kitty 原 move_window_forward）
map cmd+shift+,  send_text all \x00{       # swap-pane 与上一个 pane 换位（原生 prefix {；kitty 原 move_window_backward）
map ctrl+cmd+shift+. send_text all \x00"   # move-pane 送到右邻窗口（自定义绑定 "；kitty 原 detach_window tab-right）
map ctrl+cmd+shift+, send_text all \x00'   # move-pane 送到左邻窗口（自定义绑定 '；kitty 原 detach_window tab-left）

#: layout
map cmd+shift+=  send_text all \x00z       # resize-pane -Z 缩放开关 ≈ kitty stack（原生 prefix z）
map cmd+shift+t  send_text all \x00t       # select-layout main-vertical ≈ kitty tall（原生 M-4；自定义绑定 t）
map cmd+shift+f  send_text all \x00f       # select-layout main-horizontal ≈ kitty fat（原生 M-3；自定义绑定 f）
map cmd+shift+g  send_text all \x00g       # select-layout tiled ≈ kitty grid（原生 M-5；自定义绑定 g）
map cmd+shift+-  send_text all \x00-       # select-layout even-vertical ≈ kitty vertical（原生 M-2；自定义绑定 -）
map cmd+shift+\  send_text all \x00\x5c    # select-layout even-horizontal ≈ kitty horizontal（原生 M-1；自定义绑定 \）
map cmd+shift+l  send_text all \x00l       # next-layout 循环布局（原生 prefix Space；自定义绑定 l）

#: resize pane（替代原 kitty resize_window，改为调 pane 尺寸）
map ctrl+opt+w   send_text all \x00W       # resize-pane -R 3 加宽（原生 prefix 后 C-→；自定义绑定 W）
map ctrl+opt+n   send_text all \x00N       # resize-pane -L 3 减宽（原生 prefix 后 C-←；自定义绑定 N）
map ctrl+opt+t   send_text all \x00T       # resize-pane -D 3 加高（原生 prefix 后 C-↓；自定义绑定 T）
map ctrl+opt+s   send_text all \x00S       # resize-pane -U 3 减高（原生 prefix 后 C-↑；自定义绑定 S）
map ctrl+opt+r   send_text all \x00R       # select-layout -E 尺寸均匀重置（自定义绑定 R）

#: broadcast（替代原 f1 的 kitty broadcast kitten）
map f1           send_text all \x00\x1bOP  # synchronize-panes 开关，输入广播到本窗口所有 pane（自定义绑定 F1）

#: popup 浮动窗口
map cmd+shift+p  send_text all \x00P       # display-popup -w 85% -h 85% 居中浮层 shell（自定义绑定 P）

#: ---- 以下保留给 kitty：macOS 窗口级操作，tmux 管不到 ----
#: 新 OS 窗口：带 TMUX_OWN_SESSION=1，让 .zshrc 给它开独立 tmux 会话（互不干扰，
#: 而不是镜像 attach 到共享的 main 会话）
map cmd+n        launch --type=os-window --env TMUX_OWN_SESSION=1
map cmd+r        start_resizing_window    # 拖拽调整 OS 窗口大小
#: Disable keymaps
map cmd+shift+2  discard_event
#: reload config file
map ctrl+cmd+,   load_config_file

#: cursor animation
# cursor_trail 3
# cursor_trail_decay 0.1 0.4
# cursor_trail_start_threshold 2

# Scroll
pixel_scroll yes

#: theme
include theme-tokyo-night-moon.conf

#: proxy
# 让 kitty 启动的所有窗口默认带上代理环境变量(等效于每个窗口手动执行 pon)
# 个别窗口不需要代理时,在该窗口执行 poff 即可(只影响当前窗口)
env http_proxy=http://127.0.0.1:7890
env https_proxy=http://127.0.0.1:7890
env all_proxy=socks5://127.0.0.1:7890

#: workspace
# 原 startup_session workspace.conf 已由 tmux 工作区取代：
# .zshrc 检测到冷启动（无 main 会话）时自动执行 tmux/workspace.sh 建出同样的 9 窗口布局

#: ssh
share_connections yes

#: quit
macos_quit_when_last_window_closed yes
